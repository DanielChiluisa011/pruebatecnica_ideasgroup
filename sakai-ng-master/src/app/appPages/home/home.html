<div class="flex flex-col p-10">

    <p-toolbar styleClass="mb-6">
        <ng-template #start>
            <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
            <p-button severity="secondary" label="Delete" icon="pi pi-trash" outlined
                (onClick)="deleteSelectedProducts()" [disabled]="!selectedProducts || !selectedProducts.length" />
        </ng-template>
        PROYECTOS
        <ng-template #end>
            <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="proyectos()" [rows]="10" [columns]="cols" [paginator]="true"
        [globalFilterFields]="['name', 'country.name', 'representative.name', 'status']"
        [tableStyle]="{ 'min-width': '75rem' }" [(selection)]="selectedProducts" [rowHover]="true" dataKey="id"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} proyectos" [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 20, 30]">
        <ng-template #caption>
            <div class="flex items-center justify-between">
                <h5 class="m-0">Manage Products</h5>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="width: 3rem">
                    <p-tableHeaderCheckbox />
                </th>
                <th style="min-width: 16rem">Secuencial</th>
                <th pSortableColumn="name" style="min-width:16rem">
                    Nombre
                    <p-sortIcon field="name" />
                </th>

                <th style="min-width: 12rem"></th>
            </tr>
        </ng-template>
        <ng-template #body let-proyecto>
            <tr>
                <td style="width: 3rem">
                    <p-tableCheckbox [value]="proyecto" />
                </td>
                <td style="min-width: 12rem">{{ proyecto.secuencial }}</td>
                <td style="min-width: 16rem">{{ proyecto.nombre }}</td>
                <td>
                    <p-tag [value]="proyecto.inventoryStatus" [severity]="getSeverity(proyecto.inventoryStatus)" />
                </td>
                <td>
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                        (click)="editProduct(proyecto)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                        (click)="deleteProduct(proyecto)" />
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-dialog [(visible)]="productDialog" [style]="{ width: '950px', height: '950px' }" header="Product Details"
        [modal]="true">
        <ng-template #content>
            <div class="flex flex-col h-[50vh] gap-6 ">
                <div>
                    <label for="name" class="block font-bold mb-3">Nombre</label>
                    <input type="text" pInputText id="name" [(ngModel)]="proyecto.nombre" required autofocus fluid />
                    <small class="text-red-500" *ngIf="submitted && !proyecto!.nombre">Nombre es requerido.</small>
                </div>
                <div>
                    <label for="description" class="block font-bold mb-3">Descripción</label>
                    <textarea id="description" pTextarea [(ngModel)]="proyecto.descripcion" required rows="3" cols="20"
                        fluid></textarea>
                </div>
                <div>
                    <label for="description" class="block font-bold mb-3">Fecha Inicio</label>
                    <p-datepicker [showIcon]="true" [showButtonBar]="true"
                        [(ngModel)]="proyecto.fechaCreacion"></p-datepicker>
                </div>
                <div>
                    <label for="description" class="block font-bold mb-3">Fecha Fin</label>
                    <p-datepicker [showIcon]="true" [showButtonBar]="true"
                        [(ngModel)]="proyecto.fechaFin"></p-datepicker>
                </div>

            </div>
        </ng-template>

        <ng-template #footer>
            <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
            <p-button label="Save" icon="pi pi-check" (click)="saveProduct()" />
        </ng-template>
    </p-dialog>

    <p-confirmdialog [style]="{ width: '450px' }" />
</div>
